name: Evals (diff-selected ablation)

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Target harness CLI installed on Ubuntu CI (codex or claude)"
        required: true
        default: "codex"
        type: choice
        options:
          - codex
          - claude
      case:
        description: "Eval case glob (leave blank to auto-select from PR diff or tier)"
        required: false
        default: ""
        type: string
      tier:
        description: "Cumulative eval tier (leave blank to auto-select from diff)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - smoke
          - core
          - deep
      ablation:
        description: "Run with-without ablation"
        required: true
        default: "with-without"
        type: choice
        options:
          - with-without
          - none
      runs:
        description: "Trials per arm (1 for smoke check; 3+ for variance-checked ablation)"
        required: false
        default: "1"
        type: string
      parallel:
        description: "Parallel worker threads for eval runs"
        required: false
        default: "2"
        type: string
  pull_request:
    types: [labeled]

jobs:
  run-evals:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required API key is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS: ${{ inputs.harness || 'codex' }}
        run: |
          if [ "$HARNESS" = "codex" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is required to run Codex evals."
            exit 1
          fi
          if [ "$HARNESS" = "claude" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is required to run Claude evals."
            exit 1
          fi
      - name: Select diff-affected eval cases
        id: select
        env:
          INPUT_CASE: ${{ inputs.case }}
          INPUT_TIER: ${{ inputs.tier }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="${BASE_REF:-main}"
          if [ -n "${INPUT_CASE:-}" ] && [ -n "${INPUT_TIER:-}" ]; then
            SELECTED=$(python3 -B scripts/eval.py --case "$INPUT_CASE" --tier "$INPUT_TIER" --list-selected)
          elif [ -n "${INPUT_CASE:-}" ]; then
            SELECTED=$(python3 -B scripts/eval.py --case "$INPUT_CASE" --list-selected)
          elif [ -n "${INPUT_TIER:-}" ]; then
            SELECTED=$(python3 -B scripts/eval.py --tier "$INPUT_TIER" --list-selected)
          else
            SELECTED=$(python3 -B scripts/eval.py --select-from-diff "origin/$BASE" --list-selected)
            if [ -z "$SELECTED" ]; then
              SELECTED=$(python3 -B scripts/eval.py --tier smoke --list-selected)
            fi
          fi
          CASES=$(printf '%s\n' "$SELECTED" | awk 'NF' | paste -sd, -)
          if [ -z "$CASES" ]; then
            echo "::error::No eval cases matched selection (case='${INPUT_CASE:-}', tier='${INPUT_TIER:-}')."
            exit 1
          fi
          echo "cases=$CASES" >> "$GITHUB_OUTPUT"
          echo "Selected cases: $CASES"
      - name: Install Codex CLI
        if: (inputs.harness || 'codex') == 'codex'
        run: npm install -g @openai/codex
      - name: Install Claude Code CLI
        if: inputs.harness == 'claude'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run ablation evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS: ${{ inputs.harness || 'codex' }}
          ABLATION: ${{ inputs.ablation || 'with-without' }}
          RUNS: ${{ inputs.runs || '1' }}
          PARALLEL: ${{ inputs.parallel || '2' }}
          CASES: ${{ steps.select.outputs.cases }}
        run: |
          set -euo pipefail
          if [ -z "${CASES:-}" ]; then
            echo "::error::CASES is empty; refusing to invoke scripts/eval.py with an empty --case filter."
            exit 1
          fi
          mkdir -p eval-results
          EXTRA_ARGS=()
          if [ "$HARNESS" = "codex" ]; then
            EXTRA_ARGS+=(
              --reviewer-pool '[{"provider":"openai","model":"gpt-5.4","effort":"medium","harness":"codex"},{"provider":"openai","model":"gpt-5.4-mini","effort":"medium","harness":"codex"}]'
              --worker-model '{"provider":"openai","model":"gpt-5.4-mini","effort":"medium","harness":"codex"}'
            )
          fi
          EVAL_EXIT=0
          set +e
          python3 -u -B scripts/eval.py \
            --harness "$HARNESS" \
            --case "$CASES" \
            --ablation "$ABLATION" \
            --runs "$RUNS" \
            --parallel "$PARALLEL" \
            --report-out eval-results/report.json \
            --markdown-out eval-results/scorecard.md \
            "${EXTRA_ARGS[@]}" \
            --json > eval-results/trials.json
          EVAL_EXIT=$?
          set -e
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f eval-results/scorecard.md ]; then
            cat eval-results/scorecard.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$EVAL_EXIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-ablation-results
          path: eval-results/
          if-no-files-found: error
