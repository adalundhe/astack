name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated packages are up to date
        run: python3 scripts/build.py --check
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
